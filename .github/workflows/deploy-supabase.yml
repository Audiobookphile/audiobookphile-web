name: Deploy Supabase (Migrations & Edge API)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Push Migrations & Edge Functions
    # Hosted by default so a cloned/forked repository can deploy without the
    # project's self-hosted fleet. Set the repository variable
    # SUPABASE_RUNNER to a JSON array (e.g. ["self-hosted","Linux","ram-3g"])
    # to route the job back onto your own runners.
    runs-on: ${{ vars.SUPABASE_RUNNER != '' && fromJSON(vars.SUPABASE_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Host Pressure Preflight
        if: vars.SUPABASE_RUNNER != ''
        run: ./scripts/host-pressure.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check Supabase Credentials
        id: check_creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID not set. Skipping automated Supabase deployment."
            echo "has_creds=false" >> $GITHUB_OUTPUT
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Link Supabase Project
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          bun run supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Push Database Migrations
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          bun run supabase db push --linked --include-all --yes

      - name: Deploy Unified Edge API Function
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt..."
            if bun run supabase functions deploy api --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt; then
              echo "✅ Function api deployed successfully."
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "❌ All 3 deploy attempts failed."
              exit 1
            fi
            echo "⚠️ Transient error during function deploy. Retrying in 5s..."
            sleep 5
          done
