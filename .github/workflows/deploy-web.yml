name: Deploy Next.js Web App (Vercel Production)

on:
  # Parked: run manually from the Actions tab when needed.
  workflow_dispatch: {}
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Web Build & Linting
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        id: deps
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Web Build & Linting" deps \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|audit:Security Audit|typecheck:Typecheck|lint:Lint|build:Build Next.js Bundle" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }}"
          bun install --frozen-lockfile

      - name: Run Lefthook pre-commit
        id: pre_commit
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Web Build & Linting" pre_commit \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|pre_commit:Run Lefthook pre-commit|pre_push:Run Lefthook pre-push|build:Build Next.js Bundle" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }}"
          bunx lefthook run pre-commit --all-files

      - name: Run Lefthook pre-push
        id: pre_push
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Web Build & Linting" pre_push \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|pre_commit:Run Lefthook pre-commit|pre_push:Run Lefthook pre-push|build:Build Next.js Bundle" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};pre_commit=${{ steps.pre_commit.outcome }}"
          bunx lefthook run pre-push --all-files

      - name: Build Next.js Bundle
        id: build
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Verify Web Build & Linting" build \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|pre_commit:Run Lefthook pre-commit|pre_push:Run Lefthook pre-push|build:Build Next.js Bundle" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};pre_commit=${{ steps.pre_commit.outcome }};pre_push=${{ steps.pre_push.outcome }}"
          bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'organicnz' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'audiobookphile' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN || '' }}

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        id: deps
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Lighthouse Performance Audit" deps \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|audit:Run Lighthouse CI" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }}"
          bun install --frozen-lockfile

      - name: Build Next.js Bundle
        id: build
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Lighthouse Performance Audit" build \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|audit:Run Lighthouse CI" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }}"
          bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'organicnz' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'audiobookphile' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN || '' }}

      - name: Run Lighthouse CI
        id: audit
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Lighthouse Performance Audit" audit \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|audit:Run Lighthouse CI" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};build=${{ steps.build.outcome }}"
          bunx lhci autorun
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'organicnz' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'audiobookphile' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN || '' }}
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  size-limit:
    name: Bundle Size Limit
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        id: deps
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Bundle Size Limit" deps \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|check:Check Size Limit" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }}"
          bun install --frozen-lockfile

      - name: Build Next.js Bundle
        id: build
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Bundle Size Limit" build \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|check:Check Size Limit" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }}"
          bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'organicnz' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'audiobookphile' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN || '' }}

      - name: Check Size Limit
        id: check
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Bundle Size Limit" check \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|check:Check Size Limit" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};build=${{ steps.build.outcome }}"
          bunx size-limit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'organicnz' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'audiobookphile' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN || '' }}

  deploy:
    name: Deploy to Vercel (Preview Build)
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 20
    concurrency:
      group: deploy-web-prod-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check Vercel Token & Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "Deploy to Vercel (Preview Build)" deploy \
            "checkout:Checkout Repository|bun:Setup Bun|deploy:Check Vercel Token & Deploy" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }}"
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is unset; relying on native Vercel Git Integration deployment."
            exit 0
          fi
          # The npm package is broken upstream (@deno/eszip tarball 404) and
          # vercel.com/install.sh serves an HTML challenge to scripts. Use
          # the Homebrew formula instead.
          brew install vercel-cli
          vercel --version
          # Preview-first flow: build for preview, run E2E against it, then
          # promote to production — so broken builds never reach prod.
          brew install vercel-cli
          vercel --version
          vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          vercel build --token=$VERCEL_TOKEN
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=$VERCEL_TOKEN | grep -Eo 'https://[^ ]+' | tail -1)
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "##[error]Failed to capture deployment URL"
            exit 1
          fi
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E Smoke (Playwright)
    needs: deploy
    if: needs.deploy.outputs.deployment_url != ''
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        id: deps
        run: |
          . .github/scripts/step-tree.sh
          step_tree "E2E Smoke (Playwright)" deps \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|browsers:Install Playwright Chromium|e2e:Run E2E Smoke Against Preview" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }}"
          bun install --frozen-lockfile

      - name: Install Playwright Chromium & WebKit
        id: browsers
        run: |
          . .github/scripts/step-tree.sh
          step_tree "E2E Smoke (Playwright)" browsers \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|browsers:Install Playwright Chromium & WebKit|e2e:Run E2E Smoke Against Preview" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }}"
          bunx playwright install --with-deps chromium webkit

      - name: Pull Vercel Environment (.env.local)
        id: envpull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel env pull .env.local --yes --environment=preview --token=$VERCEL_TOKEN
          # Suite reads SUPABASE_SERVICE_KEY as the service-role alias
          if ! grep -q "^SUPABASE_SERVICE_KEY=" .env.local; then
            VAL=$(grep -E "^SUPABASE_SERVICE_ROLE_KEY=" .env.local | head -1 | cut -d= -f2- | tr -d '"' )
            echo "SUPABASE_SERVICE_KEY=\"$VAL\"" >> .env.local
          fi

      - name: Seed Passkey/2FA Test User
        id: seeduser
        run: |
          URL=$(grep -E "^NEXT_PUBLIC_SUPABASE_URL=" .env.local | head -1 | cut -d= -f2- | tr -d '"')
          SK=$(grep -E "^SUPABASE_SERVICE_KEY=" .env.local | head -1 | cut -d= -f2- | tr -d '"')
          EMAIL="e2e-passkey@audiobookphile.test"
          CREATE=$(curl -s -X POST "$URL/auth/v1/admin/users" \
            -H "apikey: $SK" -H "Authorization: Bearer $SK" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"TestPass123!\",\"email_confirm\":true}")
          UID_=$(echo "$CREATE" | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))")
          if [ -z "$UID_" ]; then
            ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$EMAIL")
            UID_=$(curl -s "$URL/auth/v1/admin/users?email=$ENC" \
              -H "apikey: $SK" -H "Authorization: Bearer $SK" \
              | python3 -c "import json,sys;u=(json.load(sys.stdin).get('users') or []);print(u[0]['id'] if u else '')")
          fi
          echo "USER_ID=$UID_" > /tmp/passkey_e2e_user.env
          echo "EMAIL=$EMAIL" >> /tmp/passkey_e2e_user.env
          echo "seeded user: ${UID_:0:8}…"

      - name: Run E2E Smoke Against Preview
        id: e2e
        run: |
          . .github/scripts/step-tree.sh
          step_tree "E2E Smoke (Playwright)" e2e \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|browsers:Install Playwright Chromium|e2e:Run E2E Smoke Against Preview" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};browsers=${{ steps.browsers.outcome }}"
          bun run test
        env:
          NEXT_PUBLIC_SITE_URL: ${{ needs.deploy.outputs.deployment_url }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          PLAYWRIGHT_MEMBER_EMAIL: ${{ secrets.PLAYWRIGHT_MEMBER_EMAIL }}
          PLAYWRIGHT_MEMBER_PASSWORD: ${{ secrets.PLAYWRIGHT_MEMBER_PASSWORD }}
        timeout-minutes: 40

  promote:
    name: Promote Preview to Production
    needs: e2e
    if: needs.deploy.outputs.deployment_url != ''
    runs-on: [self-hosted, macOS]
    timeout-minutes: 15
    steps:
      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        id: vercel_install
        run: |
          brew install vercel-cli
          vercel --version

      - name: Promote Deployment
        id: promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel promote ${{ needs.deploy.outputs.deployment_url }} --yes --token=$VERCEL_TOKEN

  e2e-pr:
    name: E2E Smoke (Playwright Local)
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v4

      # This job starts a real dev server and drives a browser against it, which
      # is the exact workload the OOM killer takes out on this shared host. Fail
      # on the host's state now, with a message that says so, rather than as a
      # page.goto that never connects.
      - name: Host Pressure Preflight
        id: host
        run: ./scripts/host-pressure.sh

      - name: Setup Bun
        id: bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        id: deps
        run: |
          . .github/scripts/step-tree.sh
          step_tree "E2E Smoke (Playwright Local)" deps \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|browsers:Install Playwright Chromium & WebKit|e2e:Run E2E Smoke Locally" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }}"
          bun install --frozen-lockfile

      - name: Build Next.js Bundle
        id: build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'organicnz' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'audiobookphile' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN || '' }}
        run: |
          . .github/scripts/step-tree.sh
          step_tree "E2E Smoke (Playwright Local)" build \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|browsers:Install Playwright Chromium & WebKit|e2e:Run E2E Smoke Locally" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }}"
          bun run build

      - name: Install Playwright Chromium & WebKit
        id: browsers
        run: |
          . .github/scripts/step-tree.sh
          step_tree "E2E Smoke (Playwright Local)" browsers \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|browsers:Install Playwright Chromium & WebKit|e2e:Run E2E Smoke Locally" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};build=${{ steps.build.outcome }}"
          bunx playwright install --with-deps chromium webkit

      - name: Run E2E Smoke Locally
        id: e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || '' }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || '' }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'organicnz' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'audiobookphile' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN || '' }}
          PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
          PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
          PLAYWRIGHT_MEMBER_EMAIL: ${{ secrets.PLAYWRIGHT_MEMBER_EMAIL }}
          PLAYWRIGHT_MEMBER_PASSWORD: ${{ secrets.PLAYWRIGHT_MEMBER_PASSWORD }}
        run: |
          if [ -z "$PLAYWRIGHT_ADMIN_EMAIL" ] || [ -z "$PLAYWRIGHT_ADMIN_PASSWORD" ]; then
            echo "PLAYWRIGHT_ADMIN_EMAIL/PASSWORD are required for the e2e gate"
            exit 1
          fi
          . .github/scripts/step-tree.sh
          step_tree "E2E Smoke (Playwright Local)" e2e \
            "checkout:Checkout Repository|bun:Setup Bun|deps:Install Dependencies|build:Build Next.js Bundle|browsers:Install Playwright Chromium & WebKit|e2e:Run E2E Smoke Locally" \
            "checkout=${{ steps.checkout.outcome }};bun=${{ steps.bun.outcome }};deps=${{ steps.deps.outcome }};build=${{ steps.build.outcome }};browsers=${{ steps.browsers.outcome }}"
          bun run test
        timeout-minutes: 40
