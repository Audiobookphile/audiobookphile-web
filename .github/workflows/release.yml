name: Release Pipeline (Web)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please Versioning
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}

  sentry-release:
    name: Create Sentry Release
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Sentry Secrets
        id: secrets
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN not configured — skipping Sentry release."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "Sentry secrets configured — proceeding with release."
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install native Sentry CLI
        if: steps.secrets.outputs.available == 'true'
        uses: matbour/setup-sentry-cli@43875f9b3685bb42cdb79d089f811e53072f56da # v3
        with:
          version: 3.8.2
          organization: organicnz
          project: audiobookphile

      - name: Create Sentry Release
        if: steps.secrets.outputs.available == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: organicnz
          SENTRY_PROJECT: audiobookphile
        run: |
          set -euo pipefail
          sentry-cli releases new "$GITHUB_SHA"
          sentry-cli releases set-commits "$GITHUB_SHA" --auto --ignore-missing --ignore-empty
          sentry-cli releases finalize "$GITHUB_SHA"
          sentry-cli releases deploys "$GITHUB_SHA" new -e production
