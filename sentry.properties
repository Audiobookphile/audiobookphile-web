# Sentry CLI Configuration
# This file configures the Sentry CLI for release management and source map uploads
# Environment variables (SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT) take precedence

# Sentry organization slug
defaults.org=organicnz

# Sentry project slug
defaults.project=audiobookphile

# Sentry URL (self-hosted installations only; omit for SaaS)
# defaults.url=https://sentry.io

# Source map configuration for Next.js
# Automatically upload source maps after build
# Set SENTRY_AUTH_TOKEN environment variable for authentication

