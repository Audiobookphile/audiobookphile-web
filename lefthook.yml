pre-commit:
  parallel: true
  commands:
    lint-and-format:
      glob: '*.{js,jsx,ts,tsx,json,yml}'
      stage_fixed: true
      run: bun run scripts/pre-commit.ts {staged_files}
    format-other:
      glob: '*.{css,md}'
      stage_fixed: true
      run: bun run scripts/format-other.ts {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: bun run scripts/commit-msg.ts {1}

pre-push:
  parallel: false
  jobs:
    - name: delivery-gate
      run: bun run scripts/pre-push-gate.ts

post-merge:
  commands:
    bun-install:
      glob: 'package.json'
      run: bun install --frozen-lockfile

post-checkout:
  commands:
    bun-install:
      glob: 'package.json'
      run: bun install --frozen-lockfile
